# Render Blueprint for the backend (Express).
# Connect this repo in Render by creating a "New Blueprint" from this file, or
# create a Web Service manually (Root Directory: . / Build Command: npm install
# / Start Command: npm start). Add the three env vars below either way.
services:
  - type: web
    name: adobe-stock-metadata-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false